<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>備品購入申請 | HTMLの練習</title>
</head>

<body>
    <main>
        <h1>備品購入申請</h1>
        <p>購入したい備品について、すべての項目を入力してください。</p>
        <p>入力内容を送信して表示する練習です。内容は保存されません。</p>

        <form action="submit.php" method="post">
            <p>
                <label for="applicant_name">申請者名</label><br>
                <input type="text" id="applicant_name" name="applicant_name" required maxlength="50">
            </p>

            <p>
                <label for="item_name">備品名</label><br>
                <input type="text" id="item_name" name="item_name" required maxlength="100">
            </p>

            <p>
                <label for="amount">金額（円）</label><br>
                <input type="number" id="amount" name="amount" required min="1" max="1000000" step="1">
            </p>

            <p>
                <label for="reason">購入理由</label><br>
                <textarea id="reason" name="reason" required maxlength="500" rows="4"></textarea>
            </p>

            <button type="submit">申請する</button>
        </form>
    </main>
</body>

</html>
